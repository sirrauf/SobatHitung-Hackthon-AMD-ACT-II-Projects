<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SobatHitung — AI Finance Assistant</title>
    <meta
      name="description"
      content="SobatHitung Explorer — navigasi semua halaman dalam satu tampilan."
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/shared.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/index.css') }}"
    />
  </head>
  <body>
    <div class="explorer-layout">
      <!-- Sidebar Overlay (mobile) -->
      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Sidebar Navigation -->
      <aside class="explorer-sidebar" id="explorerSidebar">
        <div class="sidebar-header">
          <h2>SobatHitung</h2>
          <p>AI Finance Assistant</p>
        </div>

        <div class="sidebar-section-label">Publik</div>
        <ul class="sidebar-nav" id="sidebarNav">
          <li>
            <a
              href="#"
              data-page="landing"
              class="active"
              aria-current="page"
              data-od-id="nav-landing"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
              Beranda
            </a>
          </li>
          <li>
            <a href="#" data-page="about" data-od-id="nav-about">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
              Tentang Kami
            </a>
          </li>
          <li>
            <a href="#" data-page="contact" data-od-id="nav-contact">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M4 4h16c1 0 2 1 2 2v12c0 1-1 2-2 2H4c-1 0-2-1-2-2V6c0-1 1-2 2-2z"
                />
                <polyline points="22,6 12,13 2,6" />
              </svg>
              Hubungi Kami
            </a>
          </li>
        </ul>

        <div class="sidebar-section-label">Akun</div>
        <ul class="sidebar-nav">
          <li>
            <a href="#" data-page="register" data-od-id="nav-register">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="8.5" cy="7" r="4" />
                <line x1="20" y1="8" x2="20" y2="14" />
                <line x1="23" y1="11" x2="17" y2="11" />
              </svg>
              Daftar
            </a>
          </li>
          <li>
            <a href="#" data-page="login" data-od-id="nav-login">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                <polyline points="10 17 15 12 10 7" />
                <line x1="15" y1="12" x2="3" y2="12" />
              </svg>
              Masuk
            </a>
          </li>
        </ul>

        <div class="sidebar-section-label">Aplikasi</div>
        <ul class="sidebar-nav">
          <li>
            <a href="#" data-page="dashboard" data-od-id="nav-dashboard">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
                />
              </svg>
              Dashboard
            </a>
          </li>
          <li>
            <a href="#" data-page="profile" data-od-id="nav-profile">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              Profil
            </a>
          </li>
        </ul>

        <div class="sidebar-footer">
          <a
            href="https://github.com/sirrauf/SobatHitung-Hackthon-AMD-ACT-II-Projects"
            target="_blank"
            rel="noopener"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
              />
            </svg>
            GitHub
          </a>
        </div>
      </aside>

      <!-- Content Area -->
      <div class="explorer-content">
        <!-- Top Bar -->
        <div class="explorer-topbar">
          <button
            class="mobile-menu-btn"
            id="mobileMenuBtn"
            aria-label="Toggle menu navigasi"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div class="topbar-breadcrumb" id="breadcrumb" aria-live="polite">
            <span>SobatHitung</span> / Beranda
          </div>
          <div class="kbd-hint">
            <span class="kbd">&larr;</span>
            <span class="kbd">&rarr;</span>
            navigasi
          </div>
          <div class="topbar-actions">
            <a
              href="{{ url_for('landing') }}"
              class="topbar-btn"
              id="btnOpenNew"
              title="Buka halaman ini di tab baru"
              target="_blank"
              rel="noopener"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              Buka
            </a>
          </div>
        </div>

        <!-- Iframe Viewport -->
        <div class="iframe-viewport" id="viewport">
          <iframe
            id="pageFrame"
            src="{{ url_for('landing') }}"
            title="Halaman SobatHitung"
            loading="lazy"
          ></iframe>
          <div class="loading-overlay" id="loadingOverlay" aria-hidden="true">
            <div class="loading-spinner"></div>
            <div class="loading-label">Memuat halaman…</div>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  </body>
</html>
